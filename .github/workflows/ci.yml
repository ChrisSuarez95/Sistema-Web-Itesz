name: CI - Pruebas Tickets ITESZ

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Usar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correr 4 pruebas
        run: node --test tests/app.test.js
